name: macOS
on: 
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setting the Environment Up
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      # We add 'chmod +x' to grant permissions and use './' to tell the runner exactly where the file is
      run: |
        chmod +x ./setup.sh
        ./setup.sh "Alone215" "Alone215" "$NGROK_AUTH_TOKEN"

    - name: Expose and Verify Ngrok Tunnel
      run: |
        echo "Allowing time for Ngrok background tunnel initialization..."
        for i in {1..6}; do
          if curl --silent http://127.0.0.1:4040/api/tunnels > /dev/null; then
             echo "Ngrok API is up!"
             break
          fi
          echo "Waiting for Ngrok API..."
          sleep 3
        done

        echo "--------------------------------------------------------"
        echo "YOUR PUBLIC CONNECTION URL:"
        curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "--------------------------------------------------------"

    - name: Setup tmate Session
      uses: mxschmitt/action-tmate@v3
