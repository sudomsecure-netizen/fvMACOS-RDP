name: Ultimate Ubuntu Desktop VPS (With Apps)
on: 
  workflow_dispatch:

jobs:
  ubuntu-vps:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Premium Desktop Environment & Utilities
      run: |
        echo "=== Updating Repositories ==="
        sudo apt-get update -y
        
        echo "=== Installing XFCE4, VNC Server, and Core Dev Tools ==="
        sudo apt-get install -y xfce4 xfce4-goodies tightvncserver git curl jq zip unzip build-essential htop nano neofetch

    - name: Install Google Chrome Browser
      run: |
        echo "=== Downloading and Installing Google Chrome ==="
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm ./google-chrome-stable_current_amd64.deb

    - name: Pre-install Cool Desktop Applications
      run: |
        echo "=== Installing VLC, FileZilla, and Transmission ==="
        sudo apt-get install -y vlc filezilla transmission-gtv
        
        echo "=== Installing VS Code (VSCodium) ==="
        # Adds the secure repository key for the open-source VS Code binary
        wget -qO - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg | gpg --dearmor | sudo dd of=/usr/share/keyrings/vscodium-archive-keyring.gpg
        echo 'deb [ signed-by=/usr/share/keyrings/vscodium-archive-keyring.gpg ] https://download.vscodium.com/debs vscodium main' | sudo tee /etc/apt/sources.list
