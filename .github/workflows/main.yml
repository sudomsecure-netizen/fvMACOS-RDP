name: Ubuntu Desktop VPS Server (Tailscale)
on: 
  workflow_dispatch:

jobs:
  ubuntu-vps:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Desktop Environment and VNC
      run: |
        echo "=== Updating System and Installing XFCE4 + VNC ==="
        sudo apt-get update
        sudo apt-get install -y xfce4 xfce4-goodies tightvncserver

    - name: Configure VNC Password
      run: |
        echo "=== Setting VNC Password ==="
        mkdir -p ~/.vnc
        echo "irvyrvck123" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        echo -e "#!/bin/sh\nxrdb \$HOME/.Xresources\nstartxfce4 &" > ~/.vnc/xstartup
        chmod +x ~/.vnc/xstartup

    - name: Connect to Tailscale
      env:
        # We will map your Tailscale Auth Key here
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        echo "=== Installing Tailscale ==="
        curl -fsSL https://tailscale.com/install.sh | sh

        echo "=== Authenticating and Joining Network ==="
        # Authenticates and forces the runner to join your Tailscale network
        sudo tailscale up --authkey="$TAILSCALE_AUTHKEY"

    - name: Start VNC Server
      run: |
        echo "=== Launching Virtual Ubuntu Display ==="
        vncserver :1 -geometry 1280x720 -depth 24

    - name: Show Connection IP Address
      run: |
        echo "========================================================"
        echo "YOUR VPS TAILSCALE IP ADDRESS:"
        # This will print the internal Tailscale IP of your GitHub runner
        tailscale ip -4
        echo "Connect to this IP on port 5901 (e.g., 100.X.X.X:5901)"
        echo "========================================================"

    - name: Keep Runner Alive
      run: |
        echo "Ubuntu VPS is live on your Tailscale network."
        tail -f /dev/null
        
