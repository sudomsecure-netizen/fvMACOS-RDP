name: macOS VNC Server
on: 
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install and Configure VNC Server
      run: |
        echo "=== Configuring macOS VNC ==="
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
        sudo /usr/libexec/ScreenSharingPolicyConfigurator -e
        echo "VNC Server initialized"

    - name: Download and Initialize Ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "=== Installing Ngrok ==="
        curl -s https://bin.equinox.io/c/bPf3oKqavko/ngrok-stable-darwin-amd64.zip -o ngrok.zip
        unzip -q ngrok.zip
        chmod +x ./ngrok
        
        echo "=== Authenticating Ngrok ==="
        ./ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        echo "=== Launching Ngrok Tunnel ==="
        nohup ./ngrok tcp 5900 --log=stdout > /dev/null 2>&1 &

    - name: Fetch Public VNC Address
      run: |
        echo "Waiting for Ngrok tunnel link to generate..."
        for i in {1..6}; do
          if curl --silent http://127.0.0.1:4040/api/tunnels > /dev/null; then
             echo "Ngrok is connected!"
             break
          fi
          echo "Retrying..."
          sleep 3
        done

        echo "========================================================"
        echo "CONNECT TO YOUR VNC CLIENT USING THE ADDRESS BELOW:"
        curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "========================================================"

    - name: Lock Runner Alive
      uses: mxschmitt/action-tmate@v3
