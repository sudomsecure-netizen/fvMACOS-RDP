name: macOS True VNC Server
on: 
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install VNC Server Engine
      run: |
        echo "=== Installing TigerVNC Server via Homebrew ==="
        brew install tiger-vnc

    - name: Start Direct VNC Engine and Ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "=== Installing Ngrok ==="
        brew install ngrok/ngrok/ngrok
        
        echo "=== Authenticating Ngrok ==="
        /opt/homebrew/bin/ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        echo "=== Configuring Password Direct File ==="
        mkdir -p ~/.vnc
        printf "\x16\x19\x51\x47\xc0\x08\x91\x63" > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        echo "=== Launching Direct Xvnc Display Engine ==="
        # Bypasses vncserver entirely. Launches screen on display :1 (Port 5901)
        nohup /opt/homebrew/bin/Xvnc :1 -geometry 1280x720 -depth 24 -rfbauth ~/.vnc/passwd -SecurityTypes VncAuth > /dev/null 2>&1 &
        
        echo "=== Launching Ngrok Tunnel targeting Port 5901 ==="
        nohup /opt/homebrew/bin/ngrok tcp 5901 --log=stdout > /dev/null 2>&1 &

    - name: Fetch Public VNC Address
      run: |
        echo "Waiting for Ngrok tunnel link to generate..."
        for i in {1..6}; do
          if curl --silent http://127.0.0.1:4040/api/tunnels > /dev/null; then
             echo "Ngrok is connected!"
             break
          fi
          echo "Retrying..."
          sleep 3
        done

        echo "========================================================"
        echo "YOUR PUBLIC VNC ADDRESS:"
        curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "========================================================"

    - name: Keep Runner Alive
      run: |
        echo "Runner locked and active. Close the workflow run on GitHub when finished."
        tail -f /dev/null
