name: macOS Remote Desktop Server
on: 
  workflow_dispatch:

jobs:
  desktop-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Chrome Remote Desktop
      run: |
        echo "=== Installing Chrome Remote Desktop Host ==="
        brew install --cask chrome-remote-desktop-host

        echo "=== Launching Remote Desktop Engine ==="
        # Executing your exact authorization code mapped to the macOS path
        /opt/homebrew/share/chrome-remote-desktop/chrome-remote-desktop --code="4/0AeoWuM-INhOjEstdDH8rYD1ZvVX9VYBa1-R5cksIbphlzxt60XpqfPiHbRmYi8VxXo6KcQ" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$(hostname)
        
    - name: Keep Runner Alive
      run: |
        echo "Your macOS Desktop is live!"
        echo "Open the Chrome Remote Desktop app on your phone to connect."
        tail -f /dev/null
        
