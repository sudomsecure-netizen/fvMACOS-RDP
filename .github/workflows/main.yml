name: macOS True VNC Server
on: 
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install VNC Server and Tools
      run: |
        echo "=== Installing TigerVNC via Homebrew ==="
        brew install tigervnc

    - name: Configure VNC Password
      env:
        VNC_SECRET_PASS: ${{ secrets.PASSWD }}
      run: |
        echo "=== Setting VNC Password ==="
        mkdir -p ~/.vnc
        
        # Explicitly using the Homebrew binary path to bypass the .app bundle wrapper
        echo "$VNC_SECRET_PASS" | /opt/homebrew/bin/vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

    - name: Start VNC Desktop and Ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "=== Installing Ngrok ==="
        brew install ngrok/ngrok/ngrok
        
        echo "=== Authenticating Ngrok ==="
        ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        echo "=== Launching Virtual VNC Server ==="
        # Launching via the Homebrew path
        /opt/homebrew/bin/vncserver :1 -geometry 1280x720 -depth 24
        
        echo "=== Launching Ngrok Tunnel targeting Port 5901 ==="
        nohup ngrok tcp 5901 --log=stdout > /dev/null 2>&1 &

    - name: Fetch Public VNC Address
      run: |
        echo "Waiting for Ngrok tunnel link to generate..."
        for i in {1..6}; do
          if curl --silent http://127.0.0.1:4040/api/tunnels > /dev/null; then
             echo "Ngrok is connected!"
             break
          fi
          echo "Retrying..."
          sleep 3
        done

        echo "========================================================"
        echo "YOUR PUBLIC VNC ADDRESS:"
        curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "========================================================"

    - name: Keep Runner Alive
      run: |
        echo "Runner locked and active. Close the workflow run on GitHub when finished."
        tail -f /dev/null
