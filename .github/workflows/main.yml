name: macOS Remote Desktop Server
on: 
  workflow_dispatch:

jobs:
  desktop-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Chrome Remote Desktop
      run: |
        echo "=== Installing Chrome Remote Desktop ==="
        brew install --cask chrome-remote-desktop

        echo "=== Launching Remote Desktop Engine ==="
        # PASTE YOUR COPIED COMMAND FROM GOOGLE REMOTEDESKTOP DIRECTLY BELOW THIS LINE:
        DISPLAY= /opt/homebrew/share/chrome-remote-desktop/chrome-remote-desktop --code="YOUR_CODE_HERE" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name-of-host="macOS-Runner"
        
    - name: Keep Runner Alive
      run: |
        echo "Your macOS Desktop is live! Connect via the Chrome Remote Desktop app or website."
        tail -f /dev/null
