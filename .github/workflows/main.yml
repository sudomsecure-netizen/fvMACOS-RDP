name: macOS VNC Server
on: 
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download and Initialize Ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "=== Installing Ngrok via Homebrew ==="
        # Bypasses broken URLs and unzipping entirely
        brew install ngrok/ngrok/ngrok
        
        echo "=== Authenticating Ngrok ==="
        ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
        
        echo "=== Launching Ngrok Tunnel ==="
        nohup ngrok tcp 22 --log=stdout > /dev/null 2>&1 &

    - name: Fetch Public Address
      run: |
        echo "Waiting for Ngrok tunnel link to generate..."
        for i in {1..6}; do
          if curl --silent http://127.0.0.1:4040/api/tunnels > /dev/null; then
             echo "Ngrok is connected!"
             break
          fi
          echo "Retrying..."
          sleep 3
        done

        echo "========================================================"
        echo "YOUR NGROK TUNNEL ADDRESS:"
        curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "========================================================"

    - name: Launch Interactive Session
      uses: mxschmitt/action-tmate@v3
